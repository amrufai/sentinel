apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-api-secret
  namespace: sentinel
spec:
  secretStoreRef:
    name: localstack-store
    kind: SecretStore
  target:
    name: sentinel-api-secret
  data:
    - secretKey: apiKey
      remoteRef:
        key: sentinel/api-key
        property: apiKey