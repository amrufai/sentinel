apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      containers:
        - name: sentinel-api
          image: sentinel-api:v1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: DEPLOYMENT
              value: "stable"
            - name: VERSION
              value: "v1.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi