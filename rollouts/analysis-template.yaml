apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-check
  namespace: sentinel
spec:
  metrics:
    - name: error-rate
      interval: 30s
      successCondition: result[0] < 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          query: |
            (sum(rate(http_requests_total{status_code=~"5.."}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total[1m])) or vector(1))
