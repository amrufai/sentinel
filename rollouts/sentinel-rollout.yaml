apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {duration: 60}
        - setWeight: 50
        - pause: {duration: 60}
        - setWeight: 100
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      containers:
        - name: sentinel-api
          image: sentinel-api:v4.0.0
          ports:
            - containerPort: 3000
          env:
            - name: DEPLOYMENT
              value: "canary"
            - name: VERSION
              value: "v4.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi