apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: error-rate-check
        - setWeight: 50
        - analysis:
            templates:
              - templateName: error-rate-check
        - setWeight: 100
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: sentinel-api
          image: sentinel-api:v5.1.0
          ports:
            - containerPort: 3000
          env:
            - name: DEPLOYMENT
              value: "canary"
            - name: VERSION
            - name: CHAOS
              value: "true"
              value: "v5.1.0"
            - name: CHAOS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi